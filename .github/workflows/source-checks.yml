name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax without running research scripts
        run: python -m compileall -q Tools
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35'
      - name: Compile Hub and phone setup Java
        run: |
          mkdir -p /tmp/sinfall-classes
          find AndroidHub/src AndroidSetup/src -name '*.java' -print0 | xargs -0 javac -source 8 -target 8 -encoding UTF-8 -classpath "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/sinfall-classes
